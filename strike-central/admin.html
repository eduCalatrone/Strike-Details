<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Central de Clientes · Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0C0B; --surface:#131816; --surface-2:#1B221F; --surface-3:#232B27;
    --line:#29322D; --line-soft:#1F2723;
    --green:#2CC46B; --green-glow:rgba(44,196,107,.12);
    --amber:#E9B23C; --blue:#4C9AE8; --red:#FF6B5B;
    --text:#EEF3F0; --muted:#8B968F; --dim:#5E6A64;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink); color:var(--text); font-family:'Roboto',system-ui,sans-serif; font-size:15px; line-height:1.5}
  button,input,select,textarea{font-family:inherit; font-size:15px}
  ::placeholder{color:var(--dim)}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px}

  /* ================= LOGIN ================= */
  #login{min-height:100dvh; display:grid; place-items:center; padding:24px}
  #login .box{width:100%; max-width:370px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px 24px}
  .mark{font-family:'Poppins',sans-serif; font-weight:700; font-size:24px; letter-spacing:.14em; text-align:center}
  .mark span{color:var(--green)}
  .mark-sub{font-size:10px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; text-align:center; margin-top:6px}
  #login h1{font-family:'Poppins',sans-serif; font-weight:500; font-size:15px; text-align:center; margin:24px 0 20px; color:var(--muted)}

  label{display:block; font-family:'Poppins',sans-serif; font-weight:500; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .inp{width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; transition:border-color .15s}
  .inp:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-glow)}
  select.inp{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238B968F' stroke-width='1.6' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:32px}
  textarea.inp{resize:vertical; min-height:76px}
  .mb{margin-bottom:14px}

  .btn{border:1px solid var(--line); background:var(--surface-2); color:var(--text); border-radius:var(--r); padding:11px 16px; cursor:pointer; transition:border-color .15s, background .15s}
  .btn:hover{border-color:var(--green); background:var(--surface-3)}
  .btn-primary{background:var(--green); border-color:var(--green); color:#06210F; font-family:'Poppins',sans-serif; font-weight:600}
  .btn-primary:hover{filter:brightness(1.07); background:var(--green)}
  .btn-danger{color:var(--red)}
  .btn-danger:hover{border-color:var(--red)}
  .btn:disabled{opacity:.5; cursor:progress}
  .btn-full{width:100%}
  .msg{display:none; margin-top:12px; font-size:13px; color:#FFB3A9; background:rgba(255,107,91,.09); border:1px solid rgba(255,107,91,.3); border-radius:var(--r); padding:10px 12px}
  .msg.on{display:block}

  /* ================= APP ================= */
  #app{display:none}
  .top{position:sticky; top:0; z-index:20; background:rgba(10,12,11,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .top .mark{font-size:18px; text-align:left; letter-spacing:.12em}
  .top .who{margin-left:auto; color:var(--dim); font-size:12.5px}
  .tabs{display:flex; gap:4px; max-width:1180px; margin:0 auto; padding:0 16px}
  .tab{background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:11px 14px; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:500; font-size:13.5px}
  .tab.on{color:var(--text); border-bottom-color:var(--green)}

  main{max-width:1180px; margin:0 auto; padding:20px 16px 80px}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px}
  .stat{background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; cursor:pointer; text-align:left; transition:border-color .15s}
  .stat:hover{border-color:var(--green)}
  .stat.on{border-color:var(--green); background:var(--surface-2)}
  .stat b{display:block; font-family:'Poppins',sans-serif; font-weight:600; font-size:24px; line-height:1.1}
  .stat span{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}

  .filters{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px}
  .filters .inp{width:auto; flex:1; min-width:150px; padding:10px 13px}
  .filters select.inp{flex:0 0 auto; min-width:130px}

  .list{display:flex; flex-direction:column; gap:9px}
  .lead{
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:var(--r); padding:14px 16px; cursor:pointer; display:grid; gap:5px;
    grid-template-columns:1fr auto; align-items:center; transition:border-color .15s, background .15s;
  }
  .lead:hover{background:var(--surface-2); border-color:var(--line); border-left-color:var(--green)}
  .lead h3{font-family:'Poppins',sans-serif; font-weight:600; font-size:15.5px; grid-column:1}
  .lead .meta{grid-column:1; font-size:13px; color:var(--muted)}
  .lead .meta i{font-style:normal; color:var(--dim)}
  .lead .right{grid-column:2; grid-row:1/3; display:flex; flex-direction:column; align-items:flex-end; gap:6px}
  .lead .when{font-size:11.5px; color:var(--dim)}

  .pill{font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-family:'Poppins',sans-serif; font-weight:500; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .p-novo{background:rgba(44,196,107,.15); color:var(--green)}
  .p-em_contato{background:rgba(233,178,60,.15); color:var(--amber)}
  .p-encaminhado{background:rgba(76,154,232,.15); color:var(--blue)}
  .p-convertido{background:rgba(44,196,107,.25); color:#8CE9B4}
  .p-perdido{background:rgba(139,150,143,.15); color:var(--muted)}

  .empty{text-align:center; padding:56px 20px; color:var(--muted)}
  .empty b{display:block; font-family:'Poppins',sans-serif; font-size:16px; color:var(--text); margin-bottom:8px}

  /* ================= DRAWER ================= */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; display:none}
  .scrim.on{display:block}
  .drawer{
    position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(440px,100%);
    background:var(--surface); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .22s ease; overflow-y:auto;
  }
  .drawer.on{transform:none}
  .dr-head{position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line); padding:16px 20px; display:flex; align-items:center; gap:12px; z-index:2}
  .dr-head h2{font-family:'Poppins',sans-serif; font-weight:600; font-size:17px; flex:1; line-height:1.3}
  .x{background:none; border:none; color:var(--muted); font-size:26px; line-height:1; cursor:pointer; padding:0 4px}
  .dr-body{padding:18px 20px 40px}
  .dl{display:grid; grid-template-columns:88px 1fr; gap:7px 12px; font-size:14px; margin-bottom:20px}
  .dl dt{color:var(--dim); font-size:12.5px; padding-top:1px}
  .dl dd{word-break:break-word}
  .sep{height:1px; background:var(--line); margin:20px 0}
  .acts{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
  .acts .btn{flex:1; min-width:132px; text-align:center; text-decoration:none; font-size:14px; padding:10px 12px}
  .sug{font-size:12px; color:var(--green); margin-top:6px}

  @media (max-width:560px){
    .lead{grid-template-columns:1fr}
    .lead .right{grid-column:1; grid-row:auto; flex-direction:row; align-items:center; justify-content:space-between; margin-top:4px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="box">
    <div class="mark">STRI<span>KE</span></div>
    <div class="mark-sub">Central de Clientes</div>
    <h1>Acesso restrito à matriz</h1>
    <div class="mb">
      <label for="lemail">E-mail</label>
      <input class="inp" id="lemail" type="email" autocomplete="username">
    </div>
    <div class="mb">
      <label for="lsenha">Senha</label>
      <input class="inp" id="lsenha" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="btnLogin">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app">
  <div class="top">
    <div class="top-in">
      <div class="mark">STRI<span>KE</span></div>
      <span class="who" id="who"></span>
      <button class="btn" id="btnSair" style="padding:7px 13px;font-size:13px">Sair</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="clientes">Clientes</button>
      <button class="tab" data-tab="autorizados">Rede de autorizados</button>
    </div>
  </div>

  <main>
    <!-- ---- CLIENTES ---- -->
    <section id="tab-clientes">
      <div class="stats" id="stats"></div>

      <div class="filters">
        <input class="inp" id="fBusca" type="search" placeholder="Buscar por nome, telefone ou cidade">
        <select class="inp" id="fUf"><option value="">Todos os estados</option></select>
        <select class="inp" id="fAut"><option value="">Todos os autorizados</option><option value="__sem">Sem autorizado</option></select>
        <button class="btn" id="btnCsv">Exportar CSV</button>
      </div>

      <div class="list" id="listaLeads"></div>
    </section>

    <!-- ---- AUTORIZADOS ---- -->
    <section id="tab-autorizados" style="display:none">
      <div class="filters">
        <button class="btn btn-primary" id="btnNovoAut">Adicionar autorizado</button>
      </div>
      <div class="list" id="listaAut"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- ---- DRAWER: lead ---- -->
<aside class="drawer" id="drLead">
  <div class="dr-head">
    <h2 id="drNome"></h2>
    <button class="x" data-close aria-label="Fechar">&times;</button>
  </div>
  <div class="dr-body">
    <dl class="dl" id="drDados"></dl>

    <div class="acts">
      <a class="btn" id="drZapCliente" target="_blank" rel="noopener">WhatsApp do cliente</a>
      <button class="btn" id="drCopiar">Copiar dados</button>
    </div>

    <div class="sep"></div>

    <div class="mb">
      <label for="drAut">Encaminhar para</label>
      <select class="inp" id="drAut"></select>
      <div class="sug" id="drSug"></div>
    </div>

    <div class="mb">
      <label for="drStatus">Situação</label>
      <select class="inp" id="drStatus">
        <option value="novo">Novo</option>
        <option value="em_contato">Em contato</option>
        <option value="encaminhado">Encaminhado</option>
        <option value="convertido">Fechou serviço</option>
        <option value="perdido">Perdido</option>
      </select>
    </div>

    <div class="mb">
      <label for="drNota">Anotação interna</label>
      <textarea class="inp" id="drNota" placeholder="Por que esse autorizado, o que já foi combinado…"></textarea>
    </div>

    <button class="btn btn-primary btn-full" id="drSalvar">Salvar</button>
    <div class="acts" style="margin-top:10px">
      <a class="btn" id="drZapAut" target="_blank" rel="noopener">Enviar ao autorizado</a>
      <button class="btn btn-danger" id="drExcluir">Excluir</button>
    </div>
    <div class="msg" id="drMsg"></div>

    <div class="sep"></div>
    <label>Histórico</label>
    <div id="drHist" style="font-size:13px;color:var(--muted)"></div>
  </div>
</aside>

<!-- ---- DRAWER: autorizado ---- -->
<aside class="drawer" id="drAutorizado">
  <div class="dr-head">
    <h2 id="daTitulo">Autorizado</h2>
    <button class="x" data-close aria-label="Fechar">&times;</button>
  </div>
  <div class="dr-body">
    <div class="mb"><label for="daNome">Nome do responsável</label><input class="inp" id="daNome"></div>
    <div class="mb"><label for="daEmpresa">Nome da oficina</label><input class="inp" id="daEmpresa"></div>
    <div class="mb"><label for="daZap">WhatsApp <span style="text-transform:none;letter-spacing:0">(só números, com 55)</span></label><input class="inp" id="daZap" inputmode="numeric" placeholder="5569999999999"></div>
    <div class="mb"><label for="daEmail">E-mail</label><input class="inp" id="daEmail" type="email"></div>
    <div class="mb" style="display:grid;grid-template-columns:90px 1fr;gap:12px">
      <div><label for="daUf">UF</label><select class="inp" id="daUf"></select></div>
      <div><label for="daCidade">Cidade</label><input class="inp" id="daCidade"></div>
    </div>
    <div class="mb"><label for="daObs">Observações</label><textarea class="inp" id="daObs" placeholder="Especialidades, nível de certificação, capacidade…"></textarea></div>
    <div class="mb" style="display:flex;gap:18px;align-items:center">
      <label style="display:flex;gap:8px;align-items:center;margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)"><input type="checkbox" id="daAtivo" checked style="accent-color:var(--green);width:17px;height:17px"> Ativo</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)"><input type="checkbox" id="daMatriz" style="accent-color:var(--green);width:17px;height:17px"> É a matriz</label>
    </div>
    <button class="btn btn-primary btn-full" id="daSalvar">Salvar autorizado</button>
    <div class="acts" style="margin-top:10px"><button class="btn btn-danger btn-full" id="daExcluir">Excluir autorizado</button></div>
    <div class="msg" id="daMsg"></div>
  </div>
</aside>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const CFG = window.STRIKE_CONFIG;
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const LABEL = { novo:'Novo', em_contato:'Em contato', encaminhado:'Encaminhado', convertido:'Fechou serviço', perdido:'Perdido' };

let LEADS = [], AUTS = [], atual = null, autAtual = null, filtroStatus = '';

/* ================= AUTENTICAÇÃO ================= */
$('btnLogin').addEventListener('click', entrar);
$('lsenha').addEventListener('keydown', e => e.key === 'Enter' && entrar());

async function entrar() {
  const msg = $('loginMsg'), btn = $('btnLogin');
  msg.classList.remove('on'); btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('lemail').value.trim(), password: $('lsenha').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { msg.textContent = 'E-mail ou senha não conferem.'; msg.classList.add('on'); return; }
  abrirApp();
}

$('btnSair').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function abrirApp() {
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return;
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('who').textContent = user.email;
  UFS.forEach(uf => { $('fUf').add(new Option(uf, uf)); $('daUf').add(new Option(uf, uf)); });
  await carregarAutorizados();
  await carregarLeads();
}

sb.auth.getSession().then(({ data }) => { if (data.session) abrirApp(); });

/* ================= ABAS ================= */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('tab-clientes').style.display    = t.dataset.tab === 'clientes' ? '' : 'none';
  $('tab-autorizados').style.display = t.dataset.tab === 'autorizados' ? '' : 'none';
}));

/* ================= DADOS ================= */
async function carregarAutorizados() {
  const { data, error } = await sb.from('autorizados').select('*').order('matriz', { ascending:false }).order('nome');
  if (error) return console.error(error);
  AUTS = data;
  const sel = $('fAut');
  sel.innerHTML = '<option value="">Todos os autorizados</option><option value="__sem">Sem autorizado</option>';
  AUTS.forEach(a => sel.add(new Option(`${a.nome} · ${a.cidade}/${a.uf}`, a.id)));
  renderAutorizados();
}

async function carregarLeads() {
  const { data, error } = await sb.from('leads')
    .select('*, autorizado:autorizados(id,nome,empresa,cidade,uf,whatsapp)')
    .order('created_at', { ascending:false });
  if (error) return console.error(error);
  LEADS = data;
  renderLeads();
}

/* ================= LISTA DE LEADS ================= */
['fBusca','fUf','fAut'].forEach(id => $(id).addEventListener('input', renderLeads));

function filtrados() {
  const q  = $('fBusca').value.trim().toLowerCase();
  const uf = $('fUf').value, au = $('fAut').value;
  return LEADS.filter(l => {
    if (filtroStatus && l.status !== filtroStatus) return false;
    if (uf && l.uf !== uf) return false;
    if (au === '__sem' && l.autorizado_id) return false;
    if (au && au !== '__sem' && l.autorizado_id !== au) return false;
    if (q && !`${l.nome} ${l.whatsapp} ${l.cidade} ${l.email||''} ${l.veiculo||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderLeads() {
  // estatísticas
  const c = s => LEADS.filter(l => l.status === s).length;
  $('stats').innerHTML = [
    ['', 'Total', LEADS.length],
    ['novo', 'Novos', c('novo')],
    ['em_contato', 'Em contato', c('em_contato')],
    ['encaminhado', 'Encaminhados', c('encaminhado')],
    ['convertido', 'Fecharam', c('convertido')]
  ].map(([s, rot, n]) =>
    `<button class="stat ${s === filtroStatus ? 'on' : ''}" data-status="${s}"><b>${n}</b><span>${rot}</span></button>`
  ).join('');
  document.querySelectorAll('.stat').forEach(b => b.addEventListener('click', () => {
    filtroStatus = b.dataset.status === filtroStatus ? '' : b.dataset.status;
    renderLeads();
  }));

  const list = filtrados();
  if (!list.length) {
    $('listaLeads').innerHTML = `<div class="empty"><b>Nenhum cliente aqui</b>${LEADS.length ? 'Tente afrouxar os filtros.' : 'Os cadastros feitos no site aparecem nesta tela.'}</div>`;
    return;
  }
  $('listaLeads').innerHTML = list.map(l => `
    <article class="lead" data-id="${l.id}">
      <h3>${esc(l.nome)}</h3>
      <div class="meta">${esc(l.cidade)}/${l.uf} <i>·</i> ${fone(l.whatsapp)}${l.autorizado ? ` <i>·</i> ${esc(l.autorizado.nome)}` : ''}</div>
      <div class="right">
        <span class="pill p-${l.status}">${LABEL[l.status]}</span>
        <span class="when">${data(l.created_at)}</span>
      </div>
    </article>`).join('');
  document.querySelectorAll('.lead').forEach(el => el.addEventListener('click', () => abrirLead(el.dataset.id)));
}

/* ================= DRAWER DO LEAD ================= */
function abrirLead(id) {
  atual = LEADS.find(l => l.id === id);
  const l = atual;
  $('drNome').textContent = l.nome;
  $('drDados').innerHTML = linhas([
    ['WhatsApp', fone(l.whatsapp)],
    ['E-mail', l.email],
    ['Local', `${l.cidade}/${l.uf}${l.bairro ? ' · ' + l.bairro : ''}`],
    ['Veículo', l.veiculo],
    ['Serviço', l.servico_interesse],
    ['Recado', l.observacoes],
    ['Origem', l.origem],
    ['Cadastro', data(l.created_at, true)],
    ['Encaminhado', l.atribuido_em ? data(l.atribuido_em, true) : null]
  ]);

  // autorizados: mesmo estado primeiro
  const mesmo = AUTS.filter(a => a.ativo && a.uf === l.uf);
  const resto = AUTS.filter(a => a.ativo && a.uf !== l.uf);
  const opt = a => `<option value="${a.id}">${esc(a.nome)} · ${esc(a.cidade)}/${a.uf}${a.matriz ? ' (matriz)' : ''}</option>`;
  $('drAut').innerHTML = '<option value="">— ainda não encaminhado —</option>'
    + (mesmo.length ? `<optgroup label="Em ${l.uf}">${mesmo.map(opt).join('')}</optgroup>` : '')
    + (resto.length ? `<optgroup label="Outros estados">${resto.map(opt).join('')}</optgroup>` : '');
  $('drAut').value = l.autorizado_id || '';
  $('drSug').textContent = mesmo.length
    ? `${mesmo.length} autorizado(s) no mesmo estado do cliente.`
    : `Nenhum autorizado em ${l.uf} — avalie o mais próximo por região.`;

  $('drStatus').value = l.status;
  $('drNota').value = l.nota_interna || '';
  $('drZapCliente').href = `https://wa.me/55${l.whatsapp.replace(/\D/g,'').replace(/^55/,'')}`;
  $('drMsg').classList.remove('on');
  atualizarZapAut();
  carregarHistorico(l.id);
  abrir($('drLead'));
}

$('drAut').addEventListener('change', atualizarZapAut);

function atualizarZapAut() {
  const a = AUTS.find(x => x.id === $('drAut').value);
  const btn = $('drZapAut');
  if (!a || !a.whatsapp) { btn.style.opacity = .4; btn.removeAttribute('href'); btn.textContent = 'Enviar ao autorizado'; return; }
  const l = atual;
  const txt = [
    '*Novo cliente Strike*', '',
    `Nome: ${l.nome}`,
    `WhatsApp: ${fone(l.whatsapp)}`,
    `Cidade: ${l.cidade}/${l.uf}${l.bairro ? ' - ' + l.bairro : ''}`,
    l.veiculo ? `Veículo: ${l.veiculo}` : '',
    l.servico_interesse ? `Serviço: ${l.servico_interesse}` : '',
    l.observacoes ? `Recado: ${l.observacoes}` : '',
    '', 'Entre em contato e depois retorne pra gente.'
  ].filter(Boolean).join('\n');
  btn.style.opacity = 1;
  btn.href = `https://wa.me/${a.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`;
  btn.textContent = `Enviar para ${a.nome.split(' ')[0]}`;
}

$('drCopiar').addEventListener('click', async () => {
  const l = atual;
  await navigator.clipboard.writeText(
    `${l.nome}\n${fone(l.whatsapp)}\n${l.cidade}/${l.uf}\n${l.veiculo||''}\n${l.servico_interesse||''}`.trim()
  );
  $('drCopiar').textContent = 'Copiado';
  setTimeout(() => $('drCopiar').textContent = 'Copiar dados', 1600);
});

$('drSalvar').addEventListener('click', async () => {
  const btn = $('drSalvar'), msg = $('drMsg');
  btn.disabled = true; btn.textContent = 'Salvando…'; msg.classList.remove('on');

  const novoAut = $('drAut').value || null;
  const mudouAut = novoAut !== (atual.autorizado_id || null);

  const { error } = await sb.from('leads').update({
    autorizado_id: novoAut,
    status: $('drStatus').value,
    nota_interna: $('drNota').value.trim() || null
  }).eq('id', atual.id);

  btn.disabled = false; btn.textContent = 'Salvar';
  if (error) { msg.textContent = 'Não deu para salvar: ' + error.message; msg.classList.add('on'); return; }

  const { data:{ user } } = await sb.auth.getUser();
  const nomeAut = AUTS.find(a => a.id === novoAut)?.nome;
  await sb.from('historico').insert({
    lead_id: atual.id, usuario_id: user.id,
    acao: mudouAut ? (novoAut ? 'Encaminhado' : 'Encaminhamento removido') : 'Atualizado',
    detalhe: [nomeAut ? `Autorizado: ${nomeAut}` : null, `Situação: ${LABEL[$('drStatus').value]}`].filter(Boolean).join(' · ')
  });

  fechar(); await carregarLeads();
});

$('drExcluir').addEventListener('click', async () => {
  if (!confirm(`Excluir o cadastro de ${atual.nome}? Isso não pode ser desfeito.`)) return;
  const { error } = await sb.from('leads').delete().eq('id', atual.id);
  if (error) { $('drMsg').textContent = error.message; $('drMsg').classList.add('on'); return; }
  fechar(); await carregarLeads();
});

async function carregarHistorico(leadId) {
  const { data } = await sb.from('historico').select('*').eq('lead_id', leadId).order('created_at', { ascending:false }).limit(20);
  $('drHist').innerHTML = (data && data.length)
    ? data.map(h => `<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)"><b style="color:var(--text);font-weight:500">${esc(h.acao)}</b> · ${data0(h.created_at)}<br>${esc(h.detalhe||'')}</div>`).join('')
    : '<span style="color:var(--dim)">Nada registrado ainda.</span>';
}

/* ================= AUTORIZADOS ================= */
function renderAutorizados() {
  if (!AUTS.length) {
    $('listaAut').innerHTML = '<div class="empty"><b>Rede vazia</b>Cadastre a matriz e os parceiros para poder encaminhar clientes.</div>';
    return;
  }
  $('listaAut').innerHTML = AUTS.map(a => `
    <article class="lead" data-aut="${a.id}">
      <h3>${esc(a.nome)}${a.matriz ? ' <span class="pill p-novo">matriz</span>' : ''}</h3>
      <div class="meta">${esc(a.empresa||'—')} <i>·</i> ${esc(a.cidade)}/${a.uf}${a.whatsapp ? ` <i>·</i> ${fone(a.whatsapp)}` : ''}</div>
      <div class="right"><span class="pill ${a.ativo ? 'p-convertido' : 'p-perdido'}">${a.ativo ? 'ativo' : 'inativo'}</span></div>
    </article>`).join('');
  document.querySelectorAll('[data-aut]').forEach(el => el.addEventListener('click', () => abrirAutorizado(el.dataset.aut)));
}

$('btnNovoAut').addEventListener('click', () => abrirAutorizado(null));

function abrirAutorizado(id) {
  autAtual = id ? AUTS.find(a => a.id === id) : null;
  const a = autAtual || {};
  $('daTitulo').textContent = autAtual ? a.nome : 'Novo autorizado';
  $('daNome').value = a.nome || ''; $('daEmpresa').value = a.empresa || '';
  $('daZap').value = a.whatsapp || ''; $('daEmail').value = a.email || '';
  $('daUf').value = a.uf || 'RO'; $('daCidade').value = a.cidade || '';
  $('daObs').value = a.observacoes || '';
  $('daAtivo').checked = autAtual ? a.ativo : true;
  $('daMatriz').checked = !!a.matriz;
  $('daExcluir').style.display = autAtual ? '' : 'none';
  $('daMsg').classList.remove('on');
  abrir($('drAutorizado'));
}

$('daSalvar').addEventListener('click', async () => {
  const msg = $('daMsg'); msg.classList.remove('on');
  const payload = {
    nome: $('daNome').value.trim(),
    empresa: $('daEmpresa').value.trim() || null,
    whatsapp: $('daZap').value.replace(/\D/g,'') || null,
    email: $('daEmail').value.trim() || null,
    uf: $('daUf').value, cidade: $('daCidade').value.trim(),
    observacoes: $('daObs').value.trim() || null,
    ativo: $('daAtivo').checked, matriz: $('daMatriz').checked
  };
  if (!payload.nome || !payload.cidade) { msg.textContent = 'Nome e cidade são obrigatórios.'; msg.classList.add('on'); return; }

  const { error } = autAtual
    ? await sb.from('autorizados').update(payload).eq('id', autAtual.id)
    : await sb.from('autorizados').insert(payload);
  if (error) { msg.textContent = error.message; msg.classList.add('on'); return; }
  fechar(); await carregarAutorizados(); await carregarLeads();
});

$('daExcluir').addEventListener('click', async () => {
  if (!confirm(`Excluir ${autAtual.nome} da rede? Os clientes já encaminhados a ele ficam sem autorizado.`)) return;
  const { error } = await sb.from('autorizados').delete().eq('id', autAtual.id);
  if (error) { $('daMsg').textContent = error.message; $('daMsg').classList.add('on'); return; }
  fechar(); await carregarAutorizados(); await carregarLeads();
});

/* ================= CSV ================= */
$('btnCsv').addEventListener('click', () => {
  const cols = ['Nome','WhatsApp','E-mail','Cidade','UF','Bairro','Veículo','Serviço','Recado','Situação','Autorizado','Origem','Cadastro'];
  const linhas = filtrados().map(l => [
    l.nome, fone(l.whatsapp), l.email, l.cidade, l.uf, l.bairro, l.veiculo, l.servico_interesse,
    l.observacoes, LABEL[l.status], l.autorizado?.nome, l.origem, data(l.created_at, true)
  ]);
  const csv = [cols, ...linhas]
    .map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';'))
    .join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href:url, download:`clientes-strike-${new Date().toISOString().slice(0,10)}.csv` });
  a.click(); URL.revokeObjectURL(url);
});

/* ================= UTILITÁRIOS ================= */
function abrir(el) { $('scrim').classList.add('on'); el.classList.add('on'); document.body.style.overflow = 'hidden'; }
function fechar() {
  $('scrim').classList.remove('on');
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('on'));
  document.body.style.overflow = '';
}
$('scrim').addEventListener('click', fechar);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', fechar));
document.addEventListener('keydown', e => e.key === 'Escape' && fechar());

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fone(v) {
  const d = String(v || '').replace(/\D/g,'').replace(/^55/,'');
  return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`
       : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : v;
}
function data(iso, completo) {
  const d = new Date(iso);
  return completo
    ? d.toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' })
    : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}
const data0 = iso => data(iso, true);
function linhas(pares) {
  return pares.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
}
</script>
