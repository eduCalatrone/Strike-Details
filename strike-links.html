<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strike Details · Índice de Links</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mesmo sistema visual do Sistema de controle (Strike-System): branco, cinza e preto,
   vidro (liquid glass) só no topo e no menu inferior; o conteúdo continua sólido. */
:root{
  --bg:#F2F2F1;
  --surface:#FFFFFF;
  --soft:#F7F7F6;
  --ink:#121212;
  --ink-2:#3B3B3B;
  --muted:#6F6F6F;
  --line:#E2E2E0;
  --line-2:#CDCDCA;
  --primary-grad:linear-gradient(180deg,#242426 0%,#0d0d0e 55%,#000000 100%);
  --warn:#9A5B00;
  --warn-bg:#FFF3DC;
  --danger:#B42318;
  --danger-bg:#FDECEA;
  --raio:14px;
  --nav-h:64px;
  --brand:"Archivo Black","Arial Black",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --glass-tint-top:rgba(255,255,255,.62);
  --glass-tint-bottom:rgba(236,236,234,.52);
  --glass-rim-top:rgba(255,255,255,.85);
  --glass-rim-hairline:rgba(255,255,255,.35);
  --glass-rim-bottom:rgba(255,255,255,.25);
  --glass-border:rgba(18,18,18,.09);
  --glass-shadow:0 10px 30px rgba(18,18,18,.14);
  --gutter:max(16px,env(safe-area-inset-left));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
/* Fundo com leve variação de tom: o vidro precisa de algo atrás para aparecer. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(34rem 28rem at 10% 0%,rgba(255,255,255,.9),transparent 60%),
    radial-gradient(30rem 26rem at 100% 60%,rgba(18,18,18,.06),transparent 62%),
    radial-gradient(28rem 24rem at 20% 100%,rgba(160,160,155,.12),transparent 62%);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--ink);color:#fff}

/* ---------- topo (vidro) ---------- */
.topo{
  position:sticky;top:0;z-index:40;
  padding:env(safe-area-inset-top,0px) clamp(16px,4vw,44px) 0;
  background:linear-gradient(180deg,var(--glass-tint-top),var(--glass-tint-bottom));
  border-bottom:1px solid var(--glass-border);
  box-shadow:inset 0 -1px 0 var(--glass-rim-hairline);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
}
.topo__in{min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca__logo{height:18px;width:auto;flex:none;display:block}
.marca__tag{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding-left:10px;border-left:1px solid var(--line-2);white-space:nowrap}
@media (max-width:420px){.marca__tag{display:none}}

.busca{position:relative;flex:1 1 200px;max-width:320px}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.busca input{
  width:100%;height:40px;padding:0 14px 0 38px;
  background:rgba(255,255,255,.92);border:1px solid rgba(18,18,18,.08);border-radius:999px;
  box-shadow:0 2px 8px rgba(18,18,18,.06),inset 0 1px 0 #fff;
  font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;
}
.busca input::placeholder{color:#9A9A98}
.busca input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* botão redondo do topo, igual à engrenagem do sistema */
.top-ico{
  width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.92);border:1px solid rgba(18,18,18,.08);color:var(--ink);
  box-shadow:0 2px 8px rgba(18,18,18,.08),inset 0 1px 0 #fff;
}
.top-ico svg{width:19px;height:19px}
.top-ico:hover{background:#fff}
.top-ico:active{transform:scale(.96)}

/* ---------- botões ---------- */
.btn{
  height:46px;padding:0 20px;border-radius:12px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;
  font:600 15px/1 var(--body);
  transition:transform .14s,filter .18s,background .18s,border-color .18s;
}
.btn svg{width:17px;height:17px}
.btn:active{transform:translateY(1px)}
.btn--primario{background:var(--primary-grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn--primario:hover{filter:brightness(1.25)}
.btn--linha{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--linha:hover{border-color:var(--ink)}
.btn--fantasma{background:transparent;color:var(--muted);padding:0 12px}
.btn--fantasma:hover{color:var(--ink);background:rgba(18,18,18,.05)}
.btn--perigo:hover{color:var(--danger);background:var(--danger-bg)}

/* ---------- fileiras ---------- */
.fileira{margin:30px 0 4px;scroll-margin-top:84px}
.fileira__topo{display:flex;align-items:flex-end;gap:10px;padding:0 clamp(16px,4vw,44px);margin-bottom:12px}
.fileira__titulo{margin:0;font:700 24px/1.05 var(--cond);letter-spacing:.01em;white-space:nowrap}
.fileira__cont{color:var(--muted);font-size:14px;line-height:1.4}
.fileira__nota{
  font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:6px 10px;
  margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.fileira__nota svg{width:12px;height:12px}
.pag{display:flex;gap:4px;margin-left:auto;align-items:center;padding-bottom:6px}
.fileira__nota + .pag{margin-left:12px}
.pag__b{width:15px;height:3px;border-radius:3px;background:var(--line-2);transition:background .2s}
.pag__b.on{background:var(--ink)}

.trilho-wrap{position:relative}
.trilho{
  display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;
  padding:4px clamp(16px,4vw,44px) 18px;
  scroll-snap-type:x mandatory;scroll-padding-inline:clamp(16px,4vw,44px);scrollbar-width:none;
}
.trilho::-webkit-scrollbar{display:none}
.trilho.arrastando{scroll-behavior:auto;scroll-snap-type:none;cursor:grabbing;user-select:none}
.seta{
  position:absolute;top:4px;bottom:66px;width:clamp(34px,4vw,52px);z-index:5;
  display:none;place-items:center;cursor:pointer;border:0;padding:0;
  color:var(--ink);opacity:0;transition:opacity .2s;
}
.seta svg{width:22px;height:22px;transition:transform .18s}
.seta--esq{left:0;background:linear-gradient(90deg,rgba(242,242,241,.96),rgba(242,242,241,0))}
.seta--dir{right:0;background:linear-gradient(270deg,rgba(242,242,241,.96),rgba(242,242,241,0))}
.trilho-wrap:hover .seta,.seta:focus-visible{opacity:1}
.seta:hover svg{transform:scale(1.25)}
@media (hover:hover) and (min-width:900px){.seta{display:grid}}

/* ---------- card ---------- */
.card{
  position:relative;flex:none;width:246px;scroll-snap-align:start;
  cursor:pointer;border-radius:var(--raio);outline:none;
  transition:transform .22s cubic-bezier(.2,.7,.2,1);
}
.card:hover,.card:focus-visible{transform:translateY(-4px)}
.card:focus-visible .card__capa{box-shadow:0 0 0 2px var(--ink)}
.card__capa{
  position:relative;overflow:hidden;aspect-ratio:16/10;border-radius:var(--raio);
  background:linear-gradient(160deg,#FFFFFF 0%,#F7F7F6 60%,#EFEFED 100%);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(18,18,18,.04);
  transition:border-color .22s,box-shadow .22s;
}
.card:hover .card__capa{border-color:var(--line-2);box-shadow:0 12px 28px rgba(18,18,18,.10)}
.card__fantasma{
  position:absolute;right:-14px;bottom:-18px;width:108px;height:108px;
  color:var(--ink);opacity:.06;transition:opacity .25s,transform .35s;
}
.card:hover .card__fantasma{opacity:.1;transform:scale(1.06) rotate(-3deg)}
.card__chip{
  position:absolute;left:14px;top:13px;width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  background:var(--primary-grad);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.18);
}
.card__chip svg{width:19px;height:19px}
.card__brilho{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 32%,rgba(18,18,18,.02) 46%,rgba(18,18,18,.06) 50%,rgba(18,18,18,.02) 54%,transparent 68%);
  transform:translateX(-125%);
  transition:transform .85s cubic-bezier(.25,.6,.2,1),opacity .2s;
}
.card:hover .card__brilho,.card:focus-visible .card__brilho{opacity:1;transform:translateX(125%)}
.card__selo{
  position:absolute;right:12px;top:14px;
  font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;
  padding:5px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);
}
.card__selo--off{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.card__rapido{
  position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:7px;
  opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
}
.card:hover .card__rapido,.card:focus-within .card__rapido{opacity:1;transform:none}
@media (hover:none){.card__rapido{opacity:1;transform:none}}
.mini{
  height:30px;padding:0 12px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.82);border:1px solid rgba(18,18,18,.10);color:var(--ink);
  box-shadow:0 2px 8px rgba(18,18,18,.08),inset 0 1px 0 #fff;
  font:600 12px/1 var(--body);text-decoration:none;
  backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);
}
.mini svg{width:13px;height:13px}
.mini:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.card__meta{padding:10px 3px 0}
.card__titulo{font-size:14px;font-weight:600;line-height:1.3}
.card__host{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card--off .card__capa{opacity:.6}
.card--off .card__titulo{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(180,35,24,.5)}

.vazio{padding:60px clamp(16px,4vw,44px);text-align:center;color:var(--muted);font-size:14px}
.vazio strong{display:block;color:var(--ink);font:700 28px/1.05 var(--cond);margin-bottom:6px}

/* ---------- modal ---------- */
.tela{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(18,18,18,.32);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.tela.aberta{display:flex}
.folha{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 24px 60px rgba(18,18,18,.22);
  padding:24px;animation:sobe .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes sobe{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.folha__topo{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.folha__chip{
  width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;
  background:var(--primary-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.folha__chip svg{width:22px;height:22px}
.folha__grupo{font:600 11px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.folha__fechar{margin-left:auto}
.folha h2{margin:0 0 8px;font:700 30px/1.05 var(--cond);letter-spacing:.01em}
.folha__nota{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:0 0 16px}
.urlbox{
  display:block;width:100%;text-align:left;
  font:500 13px/1.5 var(--body);color:var(--ink);
  background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:18px;word-break:break-all;cursor:copy;
}
.urlbox:hover{border-color:var(--ink)}
.folha__acoes{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.folha__acoes .btn{flex:1 1 auto;justify-content:center}
.folha__acoes .btn--fantasma{flex:0 0 auto}

/* ---------- formulário ---------- */
.campo{margin-bottom:14px;display:grid;gap:6px}
.campo label{font-weight:600;font-size:13px;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{
  width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  font-size:16px;padding:11px 12px;outline:none;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.campo select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.campo textarea{resize:vertical;min-height:70px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icones{display:flex;flex-wrap:wrap;gap:8px}
.icone-op{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-2);color:var(--muted);
}
.icone-op svg{width:19px;height:19px}
.icone-op:hover{color:var(--ink);border-color:var(--ink)}
.icone-op[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- menu inferior (vidro) ---------- */
.nav{
  position:fixed;z-index:30;
  left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;padding:0 6px;border-radius:30px;
  --glass-tint-top:rgba(255,255,255,.74);--glass-tint-bottom:rgba(240,240,238,.66);
  background:linear-gradient(180deg,var(--glass-tint-top),var(--glass-tint-bottom));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-rim-top),inset 0 0 0 1px var(--glass-rim-hairline),inset 0 -1px 0 var(--glass-rim-bottom);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
}
.nav__in{height:var(--nav-h);display:flex;align-items:center;justify-content:space-around;gap:4px}
.nav a{
  flex:1;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:10px;
  color:var(--ink-2);text-decoration:none;font-size:11px;font-weight:600;
}
.nav a svg{width:22px;height:22px}
.nav .ico{position:relative;display:grid;place-items:center;width:56px;height:32px;border-radius:999px;transition:background-color .15s}
.nav a[aria-current="true"]{color:var(--ink);font-weight:800}
.nav a[aria-current="true"] .ico{background:rgba(18,18,18,.08)}
.nav a.nav-novo .pill{display:grid;place-items:center;width:56px;height:32px;border-radius:999px;color:#fff;
  background:var(--primary-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.25)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);z-index:99;
  background:var(--ink);color:#fff;font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.18);
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rodape{
  padding:30px clamp(16px,4vw,44px) calc(var(--nav-h) + 44px + env(safe-area-inset-bottom,0px));
  font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
}
.rodape button{
  font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px;
}
.rodape button:hover{color:var(--ink)}

@media (max-width:760px){
  .card{width:70vw;max-width:260px}
  .busca{max-width:none;order:3;flex-basis:100%}
  .fileira__nota{font-size:10px;padding:5px 8px;letter-spacing:.04em}
  .fileira__nota + .pag{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition-duration:.01ms!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<header class="topo">
  <div class="topo__in">
    <div class="marca">
      <img class="marca__logo" src="/logo-letras.png" alt="Strike Details">
      <span class="marca__tag">Índice de links</span>
    </div>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="busca" type="search" placeholder="Buscar link…  (tecla /)" autocomplete="off">
    </div>
  </div>
</header>

<main id="palco"></main>

<footer class="rodape">
  <span>Strike Details Estética Automotiva · Jaru/RO</span>
  <span id="rodape-cont"></span>
  <button id="exportar" type="button" title="Copia a lista atual no formato pronto para colar no arquivo">Exportar semente</button>
  <span>Calatrone</span>
</footer>

<nav class="nav" aria-label="Seções do índice">
  <div class="nav__in">
    <a href="#s-t-sistema" data-secao="t-sistema">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5 5.6 8a2 2 0 0 1 1.9-1.3h9a2 2 0 0 1 1.9 1.3l2.1 5.5"/><rect x="3" y="13.5" width="18" height="4.5" rx="1.6"/><path d="M6 18v1.8M18 18v1.8"/></svg></span>
      <span>Sistema</span>
    </a>
    <a href="#s-t-restrito" data-secao="t-restrito">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg></span>
      <span>Restrito</span>
    </a>
    <a href="#" class="nav-novo" id="nav-novo" aria-label="Novo link">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Novo</span>
    </a>
    <a href="#s-t-publico" data-secao="t-publico">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.2 2.4 3.3 5.4 3.3 8.5S14.2 18.1 12 20.5c-2.2-2.4-3.3-5.4-3.3-8.5S9.8 5.9 12 3.5Z"/></svg></span>
      <span>Públicos</span>
    </a>
    <a href="#" id="nav-buscar">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
      <span>Buscar</span>
    </a>
  </div>
</nav>

<!-- modal detalhe -->
<div class="tela" id="tela-item">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="item-titulo">
    <div class="folha__topo">
      <div class="folha__chip" id="item-chip"></div>
      <div>
        <div class="folha__grupo" id="item-grupo"></div>

/* =========================================================

   Editou a SEMENTE aqui no arquivo? Suba SEMENTE_VERSAO em 1.
   Todo dispositivo que abrir a página descarta a cópia antiga e
   recarrega a lista nova. Sem isso, quem já visitou continua
   vendo a versão velha para sempre.
   ========================================================= */
const SEMENTE_VERSAO = 6;
const CHAVE = 'strike-links-v3';
const CHAVE_VERSAO = 'strike-links-versao';
const Store = (() => {
  const temArtefato = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let memoria = null;
  let versaoMemoria = 0;
  return {
    async ler(){
      if(temArtefato){
        try{ const r = await window.storage.get(CHAVE); return r && r.value ? JSON.parse(r.value) : null; }
        catch(e){ return null; }
      }
      try{ const t = localStorage.getItem(CHAVE); return t ? JSON.parse(t) : null; }
      catch(e){ return memoria; }
    },
    async gravar(dados){
      const t = JSON.stringify(dados);
      if(temArtefato){
        try{ await window.storage.set(CHAVE, t); return true; }catch(e){ memoria = dados; return false; }
      }
      try{ localStorage.setItem(CHAVE, t); return true; }catch(e){ memoria = dados; return false; }
    },
    async lerVersao(){
      if(temArtefato){
        try{ const r = await window.storage.get(CHAVE_VERSAO); return r && r.value ? Number(r.value) : 0; }
        catch(e){ return 0; }
      }
      try{ return Number(localStorage.getItem(CHAVE_VERSAO)) || 0; }catch(e){ return versaoMemoria; }
    },
    async gravarVersao(v){
      versaoMemoria = v;
      if(temArtefato){
        try{ await window.storage.set(CHAVE_VERSAO, String(v)); return; }catch(e){ return; }
      }
      try{ localStorage.setItem(CHAVE_VERSAO, String(v)); }catch(e){}
    }
  };
})();

/* só http/https podem virar href — bloqueia javascript:, data:, vbs: */
const urlSegura = u => {
  const v = String(u || '').trim();
  return /^https?:\/\//i.test(v) ? v : '#';
};
const host = u => { try{ return new URL(u).host.replace(/^www\./,''); }catch(e){ return u.replace(/^https?:\/\//,'').split('/')[0]; } };

function aviso(txt){
  const t = $('#toast'); t.textContent = txt; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1900);
}
async function copiar(txt){
  try{
    await navigator.clipboard.writeText(txt);
  }catch(e){
    const a = document.createElement('textarea');
    a.value = txt; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); }catch(_){ aviso('Não deu para copiar. Copie da caixa do endereço'); document.body.removeChild(a); return; }
    document.body.removeChild(a);
  }
  aviso('Link copiado');
}

/* =========================================================
   carrossel
   ========================================================= */
function paginas(tr){ return Math.max(1, Math.round(tr.scrollWidth / tr.clientWidth)); }

function montarCarrosseis(){
  document.querySelectorAll('.trilho[id]').forEach(tr => {
    const pag = document.querySelector(`[data-pag="${tr.id}"]`);
    if(pag){
      const total = paginas(tr);
      pag.innerHTML = total > 1 ? Array.from({length:total}, () => '<span class="pag__b"></span>').join('') : '';
    }
    tr.addEventListener('scroll', () => {
      clearTimeout(tr._t);
      tr._t = setTimeout(() => atualizarCarrossel(tr), 60);
    }, {passive:true});
    atualizarCarrossel(tr);
  });
}

function atualizarCarrossel(tr){
  const fim = tr.scrollWidth - tr.clientWidth - 4;
  const pag = document.querySelector(`[data-pag="${tr.id}"]`);
  if(pag && pag.children.length){
    const idx = tr.scrollLeft >= fim ? pag.children.length - 1
              : Math.round(tr.scrollLeft / tr.clientWidth);
    [...pag.children].forEach((b,i) => b.classList.toggle('on', i === idx));
  }
}

function rolar(tr, dir){
  const fim = tr.scrollWidth - tr.clientWidth;
  const passo = tr.clientWidth * .82;
  let alvo = tr.scrollLeft + dir * passo;
  if(dir > 0 && tr.scrollLeft >= fim - 4) alvo = 0;          // volta ao início
  if(dir < 0 && tr.scrollLeft <= 4) alvo = fim;              // vai para o fim
  tr.scrollTo({left: alvo, behavior:'smooth'});
}

/* arrastar com o mouse */
let arrasto = null, arrastou = false;
document.addEventListener('pointerdown', e => {
  if(e.pointerType !== 'mouse' || e.button !== 0) return;
  const tr = e.target.closest('.trilho');
  if(!tr || e.target.closest('.mini')) return;
  arrasto = {tr, x:e.clientX, left:tr.scrollLeft};
  arrastou = false;
});
document.addEventListener('pointermove', e => {
  if(!arrasto) return;
  const dx = e.clientX - arrasto.x;
  if(!arrastou && Math.abs(dx) > 5){ arrastou = true; arrasto.tr.classList.add('arrastando'); }
  if(arrastou) arrasto.tr.scrollLeft = arrasto.left - dx;
});
document.addEventListener('pointerup', () => {
  if(!arrasto) return;
  arrasto.tr.classList.remove('arrastando');
  atualizarCarrossel(arrasto.tr);
  arrasto = null;
  if(arrastou) setTimeout(() => { arrastou = false; }, 200);
});

window.addEventListener('resize', () => {
  clearTimeout(window._r);
  window._r = setTimeout(montarCarrosseis, 180);
});

   menu inferior: ir para a fileira e marcar a aba da fileira visível
   ========================================================= */
function irPara(id){
  if(filtro){ filtro = ''; $('#busca').value = ''; render(); }
  const alvo = document.getElementById('s-' + id);
  if(alvo) alvo.scrollIntoView({block:'start'});
}
function marcarSecao(){
  const abas = document.querySelectorAll('.nav [data-secao]');
  let atual = null;
  if(!filtro){
    const linha = window.innerHeight * .4;
    document.querySelectorAll('.fileira[id^="s-"]').forEach(sec => {
      if(sec.getBoundingClientRect().top <= linha) atual = sec.id.slice(2);
    });
    const secoes = document.querySelectorAll('.fileira[id^="s-"]');
    if(!atual && secoes.length) atual = secoes[0].id.slice(2);
    // fim da página: a última fileira não chega ao topo, então ela fica marcada
    if(secoes.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) atual = secoes[secoes.length-1].id.slice(2);
  }
  abas.forEach(a => a.setAttribute('aria-current', String(a.dataset.secao === atual)));
}
addEventListener('scroll', () => { cancelAnimationFrame(marcarSecao._r); marcarSecao._r = requestAnimationFrame(marcarSecao); }, {passive:true});

const NOME_GRUPO = {sistema:'Sistema de controle', restrito:'Acesso restrito', publico:'Público'};
let itemAtual = null;
function abrirItem(id){

function montarIcones(){
  $('#f-icones').innerHTML = Object.keys(I).map(k =>
    `<button type="button" class="icone-op" data-icone="${k}" aria-pressed="false" aria-label="${k}" style="--c:${cor(k)}">${svg(k)}</button>`
  ).join('');
}
function marcarIcone(k){
  iconeEscolhido = k;
  document.querySelectorAll('.icone-op').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.icone === k)));
}
function abrirForm(l){
  editandoId = l ? l.id : null;
  $('#form-titulo').textContent = l ? 'Editar link' : 'Novo link';
  $('#f-titulo').value = l ? l.titulo : '';
  $('#f-url').value    = l ? l.url : '';
  $('#f-nota').value   = l ? (l.nota||'') : '';
  $('#f-grupo').value  = l ? l.grupo : 'restrito';
  $('#f-status').value = l ? (l.status||'ativo') : 'ativo';
  marcarIcone(l ? l.icone : 'site');
  fecharTelas();
  $('#tela-form').classList.add('aberta');
  setTimeout(()=>$('#f-titulo').focus(), 60);
}
async function salvar(){
  let url = $('#f-url').value.trim();
  const titulo = $('#f-titulo').value.trim();
  if(!titulo){ aviso('Dê um nome ao link'); $('#f-titulo').focus(); return; }
  if(!url){ aviso('Cole o endereço do link'); $('#f-url').focus(); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  const dados = {
    titulo, url,
    nota: $('#f-nota').value.trim(),
    grupo: $('#f-grupo').value,
    status: $('#f-status').value,
    icone: iconeEscolhido
  };
  if(editandoId){
    const i = links.findIndex(l => l.id === editandoId);
    links[i] = Object.assign({}, links[i], dados);
    aviso('Link atualizado');
  }else{
    links.push(Object.assign({id:'l'+Date.now()}, dados));
    aviso('Link salvo');
  }
  await Store.gravar(links);
  fecharTelas(); render();
}

/* =========================================================
   exportar a lista atual como SEMENTE

   Gera o bloco JavaScript pronto para substituir o array SEMENTE
   lá em cima. Fluxo: edita na tela → exporta → cola no arquivo →
   sobe SEMENTE_VERSAO em 1 → commita.
   ========================================================= */
function gerarSemente(){
  const campo = (v) => "'" + String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ') + "'";
  const linhas = links.map(l =>
    '  {id:' + campo(l.id) +
    ', grupo:' + campo(l.grupo) +
    ', icone:' + campo(l.icone) +
    ', titulo:' + campo(l.titulo) +
    ', url:' + campo(l.url) +
    ', nota:' + campo(l.nota || '') +
    ', status:' + campo(l.status || 'ativo') + '}'
  ).join(',\n');
  return 'const SEMENTE = [\n' + linhas + '\n];';
}

async function exportarSemente(){
  const texto = gerarSemente();
  try{
    await navigator.clipboard.writeText(texto);
    aviso('Semente copiada. Cole no arquivo e suba SEMENTE_VERSAO');
  }catch(e){
    const janela = window.open('', '_blank');
    if(janela){
      janela.document.title = 'SEMENTE: copie e cole no strike-links.html';
      const pre = janela.document.createElement('pre');
      pre.textContent = texto;
      pre.style.cssText = 'white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;padding:24px';
      janela.document.body.appendChild(pre);
    }else{
      aviso('Não consegui copiar. Libere pop-ups ou use HTTPS');
    }
  }
}

/* =========================================================
   eventos
   ========================================================= */
document.addEventListener('click', async (e) => {
  if(arrastou){ e.preventDefault(); e.stopPropagation(); return; }

  const copiarBtn = e.target.closest('[data-copiar]');
  if(copiarBtn){ e.preventDefault(); e.stopPropagation(); copiar(copiarBtn.dataset.copiar); return; }

  if(e.target.closest('[data-stop]')){ e.stopPropagation(); return; }

  const card = e.target.closest('.card[data-id]');
  if(card){ abrirItem(card.dataset.id); return; }

  const seta = e.target.closest('[data-rolar]');
  if(seta){
    rolar(document.getElementById(seta.dataset.alvo), Number(seta.dataset.rolar));
    return;
  }

  const ic = e.target.closest('.icone-op');
  if(ic){ marcarIcone(ic.dataset.icone); return; }

  const secao = e.target.closest('[data-secao]');
  if(secao){ e.preventDefault(); irPara(secao.dataset.secao); return; }
  if(e.target.closest('#nav-novo')){ e.preventDefault(); abrirForm(null); return; }
  if(e.target.closest('#nav-buscar')){ e.preventDefault(); window.scrollTo({top:0}); $('#busca').focus(); return; }

  if(e.target.closest('[data-fechar]')){ fecharTelas(); return; }
  if(e.target.classList.contains('tela')){ fecharTelas(); return; }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') fecharTelas();
  if(e.key === '/' && document.activeElement !== $('#busca') && !document.querySelector('.tela.aberta')){
    e.preventDefault(); $('#busca').focus();
  }
  const card = e.target.closest && e.target.closest('.card[data-id]');
  if(card && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    abrirItem(card.dataset.id);
  }
});

$('#busca').addEventListener('input', e => { filtro = e.target.value; render(); });
$('#item-copiar').addEventListener('click', () => itemAtual && copiar(itemAtual.url));
$('#item-url').addEventListener('click', () => itemAtual && copiar(itemAtual.url));
$('#item-editar').addEventListener('click', () => itemAtual && abrirForm(itemAtual));
$('#item-excluir').addEventListener('click', async () => {
  if(!itemAtual) return;
  if(!confirm('Excluir “' + itemAtual.titulo + '” do índice?')) return;
  links = links.filter(l => l.id !== itemAtual.id);
  await Store.gravar(links);
  fecharTelas(); render(); aviso('Link excluído');
});
$('#f-salvar').addEventListener('click', salvar);
$('#exportar').addEventListener('click', exportarSemente);
$('#f-url').addEventListener('blur', e => {
  if(e.target.value && !document.querySelector('.icone-op[aria-pressed="true"][data-icone]:not([data-icone="site"])')){
    marcarIcone(adivinharIcone(e.target.value));
  }
});

/* =========================================================
   início
   ========================================================= */
(async function iniciar(){
  montarIcones();
  const versaoSalva = await Store.lerVersao();
  const salvos = await Store.ler();

  if(versaoSalva < SEMENTE_VERSAO || !Array.isArray(salvos) || !salvos.length){
    // arquivo mais novo que a cópia local: a lista do arquivo vence
    links = SEMENTE.slice();
    await Store.gravar(links);
    await Store.gravarVersao(SEMENTE_VERSAO);
  }else{
    links = salvos;
  }
  render();
})();
