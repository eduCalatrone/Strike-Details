<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strike · Índice de Links</title>
<meta name="theme-color" content="#0A0C0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --asfalto:#0A0C0B;
  --surface:#121614;
  --surface-2:#1A201C;
  --linha:rgba(255,255,255,.09);
  --verde:#2CC46B;
  --verde-esc:#17864A;
  --texto:#EEF3F0;
  --mute:#8B958F;
  --alerta:#FFB020;
  --perigo:#FF5C5C;
  --raio:14px;
  --display:'Bebas Neue','Montserrat',system-ui,sans-serif;
  --corpo:'Montserrat',system-ui,-apple-system,sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, rgba(44,196,107,.10), transparent 62%),
    radial-gradient(800px 400px at 92% 0%, rgba(255,255,255,.045), transparent 60%),
    var(--asfalto);
  color:var(--texto);
  font-family:var(--corpo);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--verde);color:#04150B}

/* ---------- topo ---------- */
.topo{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,44px);
  background:linear-gradient(180deg,rgba(10,12,11,.96),rgba(10,12,11,.72) 70%,transparent);
  backdrop-filter:blur(10px);
}
.marca{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.marca__logo{height:40px;width:auto;flex:none;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
@media (max-width:760px){.marca__logo{height:32px}}

.busca{position:relative;flex:1 1 200px;max-width:320px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute);pointer-events:none}
.busca input{
  width:100%;height:40px;padding:0 12px 0 36px;
  background:var(--surface);border:1px solid var(--linha);border-radius:10px;
  color:var(--texto);font-family:var(--corpo);font-size:13.5px;outline:none;
  transition:border-color .18s, background .18s;
}
.busca input::placeholder{color:var(--mute)}
.busca input:focus{border-color:rgba(44,196,107,.55);background:var(--surface-2)}

/* ---------- botões ---------- */
.btn{
  height:44px;padding:0 20px;border-radius:11px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;
  font-family:var(--corpo);font-size:14px;font-weight:600;
  transition:transform .14s, filter .18s, background .18s, border-color .18s;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(1px)}
.btn--verde{background:var(--verde);color:#04150B}
.btn--verde:hover{filter:brightness(1.08)}
.btn--linha{background:rgba(255,255,255,.05);border-color:var(--linha);color:var(--texto)}
.btn--linha:hover{background:rgba(255,255,255,.1)}
.btn--fantasma{background:transparent;color:var(--mute);border-color:transparent;font-weight:500;padding:0 12px}
.btn--fantasma:hover{color:var(--texto);background:rgba(255,255,255,.05)}
.btn--perigo:hover{color:var(--perigo)}

/* ---------- fileiras ---------- */
.fileira{margin:34px 0 4px}
.fileira__topo{
  display:flex;align-items:center;gap:11px;
  padding:0 clamp(16px,4vw,44px);margin-bottom:13px;
}
.fileira__titulo{font-family:var(--corpo);font-weight:600;font-size:16px;letter-spacing:.005em}
.fileira__cont{font-family:var(--mono);font-size:11px;color:var(--mute)}
.fileira__nota{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--alerta);margin-left:auto;display:flex;align-items:center;gap:6px;
}
.fileira__nota svg{width:12px;height:12px}
.pag{display:flex;gap:3px;margin-left:auto;align-items:center}
.fileira__nota + .pag{margin-left:14px}
.pag__b{width:15px;height:2px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .2s}
.pag__b.on{background:var(--verde)}

.trilho-wrap{position:relative}
.trilho{
  display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;
  padding:4px clamp(16px,4vw,44px) 18px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.trilho::-webkit-scrollbar{display:none}
.trilho.arrastando{scroll-behavior:auto;scroll-snap-type:none;cursor:grabbing;user-select:none}
.seta{
  position:absolute;top:4px;bottom:60px;width:clamp(34px,4vw,52px);z-index:5;
  display:none;place-items:center;cursor:pointer;border:0;padding:0;
  color:var(--texto);opacity:0;transition:opacity .2s;
}
.seta svg{width:22px;height:22px}
.seta--esq{left:0;background:linear-gradient(90deg,rgba(10,12,11,.95),rgba(10,12,11,0))}
.seta--dir{right:0;background:linear-gradient(270deg,rgba(10,12,11,.95),rgba(10,12,11,0))}
.trilho-wrap:hover .seta,.seta:focus-visible{opacity:1}
.seta:hover svg{transform:scale(1.25)}
.seta svg{transition:transform .18s}
@media (hover:hover) and (min-width:900px){.seta{display:grid}}

/* ---------- card ---------- */
.card{
  position:relative;flex:none;width:246px;scroll-snap-align:start;
  cursor:pointer;border-radius:var(--raio);outline:none;
  transition:transform .22s cubic-bezier(.2,.7,.2,1);
}
.card:hover,.card:focus-visible{transform:translateY(-5px)}
.card:focus-visible .card__capa{box-shadow:0 0 0 2px var(--verde)}
.card__capa{
  position:relative;overflow:hidden;aspect-ratio:16/10;border-radius:var(--raio);
  border:1px solid var(--linha);
  background:
    linear-gradient(150deg, color-mix(in srgb, var(--c) 26%, transparent), rgba(0,0,0,0) 58%),
    linear-gradient(180deg,#171D1A,#0D1210);
  transition:border-color .22s;
}
.card:hover .card__capa{border-color:color-mix(in srgb, var(--c) 55%, transparent)}
.card__fantasma{
  position:absolute;right:-14px;bottom:-18px;width:104px;height:104px;
  color:var(--c);opacity:.16;transition:opacity .25s, transform .35s;
}
.card:hover .card__fantasma{opacity:.26;transform:scale(1.06) rotate(-3deg)}
.card__chip{
  position:absolute;left:14px;top:13px;width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  background:color-mix(in srgb, var(--c) 16%, #0C100E);
  border:1px solid color-mix(in srgb, var(--c) 34%, transparent);
  color:var(--c);
}
.card__chip svg{width:19px;height:19px}
.card__brilho{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.10) 46%,rgba(255,255,255,.38) 50%,rgba(255,255,255,.10) 54%,transparent 68%);
  transform:translateX(-125%);
  transition:transform .85s cubic-bezier(.25,.6,.2,1), opacity .2s;
}
.card:hover .card__brilho,.card:focus-visible .card__brilho{opacity:1;transform:translateX(125%)}
.card__selo{
  position:absolute;right:12px;top:14px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;
  background:rgba(10,12,11,.72);border:1px solid var(--linha);color:var(--mute);
}
.card__selo--off{color:var(--perigo);border-color:rgba(255,92,92,.3)}
.card__rapido{
  position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:7px;
  opacity:0;transform:translateY(6px);transition:opacity .2s, transform .2s;
}
.card:hover .card__rapido,.card:focus-within .card__rapido{opacity:1;transform:none}
.mini{
  height:30px;padding:0 11px;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(8,10,9,.82);border:1px solid var(--linha);color:var(--texto);
  font-family:var(--corpo);font-size:11.5px;font-weight:500;text-decoration:none;
  backdrop-filter:blur(6px);
}
.mini svg{width:13px;height:13px}
.mini:hover{background:var(--verde);color:#04150B;border-color:var(--verde)}
.card__meta{padding:11px 3px 0}
.card__titulo{font-size:13.5px;font-weight:500;line-height:1.3}
.card__host{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card--off .card__capa{filter:saturate(.35)}
.card--off .card__titulo{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,92,92,.5)}

.vazio{
  padding:60px clamp(16px,4vw,44px);text-align:center;color:var(--mute);font-size:14px;
}
.vazio strong{display:block;color:var(--texto);font-family:var(--display);
  font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

/* ---------- modal ---------- */
.tela{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(4,6,5,.76);backdrop-filter:blur(7px);
}
.tela.aberta{display:flex}
.folha{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--linha);border-radius:18px;
  padding:26px;animation:sobe .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes sobe{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.folha__topo{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.folha__chip{
  width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb, var(--c,#2CC46B) 16%, #0C100E);
  border:1px solid color-mix(in srgb, var(--c,#2CC46B) 34%, transparent);
  color:var(--c,#2CC46B);
}
.folha__chip svg{width:23px;height:23px}
.folha__grupo{font-family:var(--mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute)}
.folha__fechar{margin-left:auto;background:none;border:none;color:var(--mute);
  cursor:pointer;padding:6px;border-radius:8px;line-height:0}
.folha__fechar:hover{color:var(--texto);background:rgba(255,255,255,.06)}
.folha__fechar svg{width:19px;height:19px}
.folha h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.04;
  letter-spacing:.02em;margin:0 0 10px;text-transform:uppercase}
.folha__nota{color:var(--mute);font-size:14px;line-height:1.55;margin:0 0 18px}
.urlbox{
  display:block;width:100%;text-align:left;
  font-family:var(--mono);font-size:12px;color:var(--texto);
  background:var(--asfalto);border:1px solid var(--linha);border-radius:11px;
  padding:13px 14px;margin-bottom:20px;word-break:break-all;line-height:1.5;cursor:copy;
}
.urlbox:hover{border-color:rgba(44,196,107,.45)}
.folha__acoes{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.folha__acoes .btn{flex:1 1 auto;justify-content:center}
.folha__acoes .btn--fantasma{flex:0 0 auto}

/* ---------- formulário ---------- */
.campo{margin-bottom:14px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.campo input,.campo select,.campo textarea{
  width:100%;background:var(--asfalto);border:1px solid var(--linha);border-radius:10px;
  color:var(--texto);font-family:var(--corpo);font-size:13.5px;padding:11px 13px;outline:none;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:rgba(44,196,107,.55)}
.campo textarea{resize:vertical;min-height:64px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icones{display:flex;flex-wrap:wrap;gap:8px}
.icone-op{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
  background:var(--asfalto);border:1px solid var(--linha);color:var(--mute);
}
.icone-op svg{width:19px;height:19px}
.icone-op:hover{color:var(--texto)}
.icone-op[aria-pressed="true"]{border-color:var(--verde);color:var(--verde);
  background:rgba(44,196,107,.1)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;
  background:var(--verde);color:#04150B;font-weight:600;font-size:13.5px;
  padding:11px 20px;border-radius:11px;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rodape{
  padding:34px clamp(16px,4vw,44px) 40px;
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(139,149,143,.5);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}

@media (max-width:760px){
  .card{width:70vw;max-width:260px}
  .busca{max-width:none;order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <img class="marca__logo" src="https://raw.githubusercontent.com/eduCalatrone/Strike-Details/main/logo.png" alt="Strike Details">
  </div>

  <div class="busca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="busca" type="search" placeholder="Buscar link…  (tecla /)" autocomplete="off">
  </div>
</header>

<main id="palco"></main>

<footer class="rodape">
  <span>Strike Estética Automotiva · Jaru/RO</span>
  <span id="rodape-cont"></span>
  <span>Calatrone</span>
</footer>

<!-- modal detalhe -->
<div class="tela" id="tela-item">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="item-titulo">
    <div class="folha__topo">
      <div class="folha__chip" id="item-chip"></div>
      <div>
        <div class="folha__grupo" id="item-grupo"></div>
      </div>
      <button class="folha__fechar" data-fechar aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <h2 id="item-titulo"></h2>
    <p class="folha__nota" id="item-nota"></p>
    <button class="urlbox" id="item-url" title="Clique para copiar"></button>
    <div class="folha__acoes">
      <a class="btn btn--verde" id="item-abrir" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1.8 1.8 0 0 1-1.8 1.8H5.2A1.8 1.8 0 0 1 3.4 19V7.8A1.8 1.8 0 0 1 5.2 6H10"/></svg>
        Abrir link
      </a>
      <button class="btn btn--linha" id="item-copiar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.4"/><path d="M15.5 5.5A2 2 0 0 0 13.5 3.5H5.6A2.1 2.1 0 0 0 3.5 5.6v7.9a2 2 0 0 0 2 2"/></svg>
        Copiar link
      </button>
      <button class="btn btn--fantasma" id="item-editar">Editar</button>
      <button class="btn btn--fantasma btn--perigo" id="item-excluir">Excluir</button>
    </div>
  </div>
</div>

<!-- modal formulário -->
<div class="tela" id="tela-form">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="form-titulo">
    <div class="folha__topo">
      <div><h2 id="form-titulo" style="margin:0">Novo link</h2></div>
      <button class="folha__fechar" data-fechar aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="campo">
      <label for="f-titulo">Nome do link</label>
      <input id="f-titulo" placeholder="Ex.: Painel de clientes">
    </div>
    <div class="campo">
      <label for="f-url">Endereço</label>
      <input id="f-url" placeholder="https://" spellcheck="false">
    </div>
    <div class="campo">
      <label for="f-nota">Para que serve</label>
      <textarea id="f-nota" placeholder="Uma linha explicando o que tem nessa página"></textarea>
    </div>
    <div class="dupla">
      <div class="campo">
        <label for="f-grupo">Grupo</label>
        <select id="f-grupo">
          <option value="restrito">Acesso restrito</option>
          <option value="publico">Público</option>
        </select>
      </div>
      <div class="campo">
        <label for="f-status">Situação</label>
        <select id="f-status">
          <option value="ativo">Em uso</option>
          <option value="off">Fora de uso</option>
        </select>
      </div>
    </div>
    <div class="campo">
      <label>Ícone da capa</label>
      <div class="icones" id="f-icones"></div>
    </div>
    <div class="folha__acoes" style="margin-top:20px">
      <button class="btn btn--verde" id="f-salvar">Salvar link</button>
      <button class="btn btn--fantasma" data-fechar>Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

  grupo:{c:'#25D366',p:'<path d="M21 11.5c0 3.6-3.8 6.5-8.5 6.5-1 0-2-.13-2.9-.37L4.5 20l1.5-3.4C4.6 15.3 4 13.5 4 11.5 4 7.9 7.8 5 12.5 5S21 7.9 21 11.5Z"/><path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01"/>'},

/* =========================================================
   armazenamento (artefato → localStorage → memória)
   ========================================================= */
const CHAVE = 'strike-links-v3';
const Store = (() => {
  const temArtefato = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let memoria = null;
  return {
    async ler(){
      if(temArtefato){
        try{ const r = await window.storage.get(CHAVE); return r && r.value ? JSON.parse(r.value) : null; }
        catch(e){ return null; }
      }
      try{ const t = localStorage.getItem(CHAVE); return t ? JSON.parse(t) : null; }
      catch(e){ return memoria; }
    },
    async gravar(dados){
      const t = JSON.stringify(dados);
      if(temArtefato){
        try{ await window.storage.set(CHAVE, t); return true; }catch(e){ memoria = dados; return false; }
      }
      try{ localStorage.setItem(CHAVE, t); return true; }catch(e){ memoria = dados; return false; }
    }
  };
})();

function aviso(txt){
  const t = $('#toast'); t.textContent = txt; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1900);
}
async function copiar(txt){
  try{
    await navigator.clipboard.writeText(txt);
  }catch(e){
    const a = document.createElement('textarea');
    a.value = txt; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); }catch(_){ aviso('Não deu para copiar — copie da caixa do endereço'); document.body.removeChild(a); return; }
    document.body.removeChild(a);
  }
  aviso('Link copiado');
}

/* =========================================================
   carrossel
   ========================================================= */
function paginas(tr){ return Math.max(1, Math.round(tr.scrollWidth / tr.clientWidth)); }

function montarCarrosseis(){
  document.querySelectorAll('.trilho[id]').forEach(tr => {
    const pag = document.querySelector(`[data-pag="${tr.id}"]`);
    if(pag){
      const total = paginas(tr);
      pag.innerHTML = total > 1 ? Array.from({length:total}, () => '<span class="pag__b"></span>').join('') : '';
    }
    tr.addEventListener('scroll', () => {
      clearTimeout(tr._t);
      tr._t = setTimeout(() => atualizarCarrossel(tr), 60);
    }, {passive:true});
    atualizarCarrossel(tr);
  });
}

function atualizarCarrossel(tr){
  const fim = tr.scrollWidth - tr.clientWidth - 4;
  const pag = document.querySelector(`[data-pag="${tr.id}"]`);
  if(pag && pag.children.length){
    const idx = tr.scrollLeft >= fim ? pag.children.length - 1
              : Math.round(tr.scrollLeft / tr.clientWidth);
    [...pag.children].forEach((b,i) => b.classList.toggle('on', i === idx));
  }
}

function rolar(tr, dir){
  const fim = tr.scrollWidth - tr.clientWidth;
  const passo = tr.clientWidth * .82;
  let alvo = tr.scrollLeft + dir * passo;
  if(dir > 0 && tr.scrollLeft >= fim - 4) alvo = 0;          // volta ao início
  if(dir < 0 && tr.scrollLeft <= 4) alvo = fim;              // vai para o fim
  tr.scrollTo({left: alvo, behavior:'smooth'});
}

/* arrastar com o mouse */
let arrasto = null, arrastou = false;
document.addEventListener('pointerdown', e => {
  if(e.pointerType !== 'mouse' || e.button !== 0) return;
  const tr = e.target.closest('.trilho');
  if(!tr || e.target.closest('.mini')) return;
  arrasto = {tr, x:e.clientX, left:tr.scrollLeft};
  arrastou = false;
});
document.addEventListener('pointermove', e => {
  if(!arrasto) return;
  const dx = e.clientX - arrasto.x;
  if(!arrastou && Math.abs(dx) > 5){ arrastou = true; arrasto.tr.classList.add('arrastando'); }
  if(arrastou) arrasto.tr.scrollLeft = arrasto.left - dx;
});
document.addEventListener('pointerup', () => {
  if(!arrasto) return;
  arrasto.tr.classList.remove('arrastando');
  atualizarCarrossel(arrasto.tr);
  arrasto = null;
  if(arrastou) setTimeout(() => { arrastou = false; }, 200);
});

window.addEventListener('resize', () => {
  clearTimeout(window._r);
  window._r = setTimeout(montarCarrosseis, 180);
});

async function salvar(){
  let url = $('#f-url').value.trim();
  const titulo = $('#f-titulo').value.trim();
  if(!titulo){ aviso('Dê um nome ao link'); $('#f-titulo').focus(); return; }
  if(!url){ aviso('Cole o endereço do link'); $('#f-url').focus(); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  const dados = {
    titulo, url,
    nota: $('#f-nota').value.trim(),
    grupo: $('#f-grupo').value,
    status: $('#f-status').value,
    icone: iconeEscolhido
  };
  if(editandoId){
    const i = links.findIndex(l => l.id === editandoId);
    links[i] = Object.assign({}, links[i], dados);
    aviso('Link atualizado');
  }else{
    links.push(Object.assign({id:'l'+Date.now()}, dados));
    aviso('Link salvo');
  }
  await Store.gravar(links);
  fecharTelas(); render();
}

document.addEventListener('click', async (e) => {
  if(arrastou){ e.preventDefault(); e.stopPropagation(); return; }

  const copiarBtn = e.target.closest('[data-copiar]');
  if(copiarBtn){ e.preventDefault(); e.stopPropagation(); copiar(copiarBtn.dataset.copiar); return; }

  if(e.target.closest('[data-stop]')){ e.stopPropagation(); return; }

  const card = e.target.closest('.card[data-id]');
  if(card){ abrirItem(card.dataset.id); return; }

  const seta = e.target.closest('[data-rolar]');
  if(seta){
    rolar(document.getElementById(seta.dataset.alvo), Number(seta.dataset.rolar));
    return;
  }

  const ic = e.target.closest('.icone-op');
  if(ic){ marcarIcone(ic.dataset.icone); return; }

  if(e.target.closest('[data-fechar]')){ fecharTelas(); return; }
  if(e.target.classList.contains('tela')){ fecharTelas(); return; }
});

document.addEventListener('keydown', (e) => {

  if(e.key === '/' && document.activeElement !== $('#busca') && !document.querySelector('.tela.aberta')){
    e.preventDefault(); $('#busca').focus();
  }
  const card = e.target.closest && e.target.closest('.card[data-id]');
  if(card && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    abrirItem(card.dataset.id);
  }
});

$('#busca').addEventListener('input', e => { filtro = e.target.value; render(); });
$('#item-copiar').addEventListener('click', () => itemAtual && copiar(itemAtual.url));
$('#item-url').addEventListener('click', () => itemAtual && copiar(itemAtual.url));
$('#item-editar').addEventListener('click', () => itemAtual && abrirForm(itemAtual));
$('#item-excluir').addEventListener('click', async () => {
  if(!itemAtual) return;
  if(!confirm('Excluir “' + itemAtual.titulo + '” do índice?')) return;
  links = links.filter(l => l.id !== itemAtual.id);
  await Store.gravar(links);
  fecharTelas(); render(); aviso('Link excluído');
});
$('#f-salvar').addEventListener('click', salvar);
$('#f-url').addEventListener('blur', e => {
  if(e.target.value && !document.querySelector('.icone-op[aria-pressed="true"][data-icone]:not([data-icone="site"])')){
    marcarIcone(adivinharIcone(e.target.value));
  }
});

/* =========================================================
   início
   ========================================================= */
(async function iniciar(){
  montarIcones();
  const salvos = await Store.ler();
  links = (Array.isArray(salvos) && salvos.length) ? salvos : SEMENTE.slice();
  if(!salvos) await Store.gravar(links);
  render();
})();
</script>
</body>
