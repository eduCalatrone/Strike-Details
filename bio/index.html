  .wrap{width:100%; max-width:460px;}

  /* ---------- topo ---------- */
  header{text-align:center; padding:52px 0 32px;}
  header img{width:212px; margin:0 auto;}
  .eyebrow{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gray);
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin-top:22px;
  }
  .eyebrow .chev{width:12px; height:7px; color:var(--green-lit);}

  /* ---------- tiles ---------- */
  .tile{
    position:relative; display:block; overflow:hidden;
    text-decoration:none; color:var(--white);
    border:1px solid var(--line);
    background:var(--surface);
    padding:22px 20px 20px;
    min-height:212px;
    margin-bottom:14px;
    isolation:isolate;
    transition:border-color .25s ease, transform .12s ease;
  }
  .tile__photo{
    position:absolute; inset:0; z-index:-2;
    background-size:cover; background-position:center;
    opacity:.55;
    transform:scale(1.03);
    transition:transform .7s cubic-bezier(.2,.7,.2,1), opacity .4s ease;
  }
  .tile__veil{
    position:absolute; inset:0; z-index:-1;
    background:linear-gradient(100deg, rgba(11,11,12,.94) 8%, rgba(11,11,12,.80) 48%, rgba(11,11,12,.46) 100%);
  }
  /* marca de dois chevrons sangrando pela direita */
  .tile__ghost{
    position:absolute; right:-34px; top:50%; z-index:-1;
    width:150px; height:auto; transform:translateY(-50%) rotate(90deg);
    color:var(--white); opacity:.07; pointer-events:none;
    transition:opacity .3s ease, right .35s cubic-bezier(.2,.7,.2,1);
  }
  .tile__rule{
    position:absolute; left:0; top:0; height:2px; width:0; z-index:2;
    background:var(--green-lit);
    transition:width .45s cubic-bezier(.2,.7,.2,1);
  }
  .tag{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--green-lit);
  }
  .tag i{width:5px; height:5px; background:var(--green-lit); display:block; flex:none;}
  .tile h2{
    font-family:'Anton','Arial Narrow',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(25px,7.4vw,31px); line-height:1.04; letter-spacing:.005em;
    margin:12px 0 11px;
  }
  .tile__go{
    display:flex; align-items:center; justify-content:flex-end; gap:9px;
    margin-top:22px;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gray);
    transition:color .25s ease, transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .tile__go .chev{width:15px; height:9px; color:var(--white); transform:rotate(90deg);}

  @media (hover:hover){
    .tile:hover{border-color:var(--line-strong);}
    .tile:hover .tile__photo{transform:scale(1.09); opacity:.7;}
    .tile:hover .tile__ghost{opacity:.12; right:-22px;}
    .tile:hover .tile__rule{width:100%;}
    .tile:hover .tile__go{color:var(--white); transform:translateX(4px);}
    .row:hover{border-color:var(--line-strong); background:rgba(21,21,23,.88);}
    .socials a:hover{border-color:var(--green-lit); color:var(--green-lit); background:rgba(63,138,92,.10); transform:translateY(-2px);}
    }
  .tile:active{transform:scale(.993);}
  .tile:active .tile__rule{width:100%;}
  .tile:focus-visible{outline:2px solid var(--green-lit); outline-offset:3px;}

  /* ---------- linha secundaria ---------- */
  .row{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); background:rgba(21,21,23,.6);
    padding:15px 18px; text-decoration:none; color:var(--white);
    transition:border-color .22s ease, background .22s ease, transform .12s ease;
  }
  .row:active{transform:scale(.993);}
  .row:focus-visible{outline:2px solid var(--green-lit); outline-offset:3px;}
  .row svg.ic{width:19px; height:19px; flex:none; color:var(--green-lit);}
  .row span{font-size:13.5px; font-weight:500; letter-spacing:.005em;}
  .row .chev{width:13px; height:8px; margin-left:auto; color:var(--gray); transform:rotate(90deg); flex:none;}

  /* ---------- rodape ---------- */
  .socials{
    display:flex; justify-content:center; gap:11px;
    margin:34px 0 0;
  }
  .socials a{
    width:50px; height:50px; display:grid; place-items:center;
    border:1px solid var(--line); color:var(--white);
    transition:border-color .22s ease, color .22s ease, background .22s ease, transform .18s ease;
  }
  .socials a:focus-visible{outline:2px solid var(--green-lit); outline-offset:3px;}
  .socials svg{width:20px; height:20px;}

  .sep{width:100%; height:1px; background:var(--line); margin:30px 0 18px;}
  footer{
    text-align:center;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
    color:#5c5f5e; line-height:2;
  }
  footer a{color:#5c5f5e; text-decoration:none;}

  /* ---------- entrada ---------- */
  .rise{opacity:0; transform:translateY(14px); animation:rise .62s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes rise{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important;}
    .rise{opacity:1; transform:none;}
  }
</style>
</head>
